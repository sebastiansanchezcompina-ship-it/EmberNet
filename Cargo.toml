[package]
name = "ember_core"
version = "0.1.0"
edition = "2021"

# 👇 ESTO ES NUEVO E IMPORTANTE
[lib]
name = "ember_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# ... otras dependencias ...
ed25519-dalek = { version = "2.1", features = ["serde"] } # 👈 Agregamos esto
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
chacha20poly1305 = "0.10"
hex = "0.4"
ratatui = "0.27"
crossterm = "0.27"
rand = "0.8"

# 👇 AGREGA ESTAS DOS PARA ANDROID
jni = "0.21"
android_logger = "0.13"
log = "0.4"
serde_json = "1.0.149"
[[bin]]
name = "ember_cli"
path = "src/main.rs"